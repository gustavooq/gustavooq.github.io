<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#avatarGrad)" />
  <!-- Gloss highlight -->
  <ellipse cx="100" cy="40" rx="70" ry="30" fill="url(#glowGrad)" />
  <!-- Silhouette Head -->
  <circle cx="100" cy="80" r="38" fill="#ffffff" opacity="0.95" />
  <!-- Silhouette Body -->
  <path d="M 40 185 C 40 135, 160 135, 160 185 Z" fill="#ffffff" opacity="0.95" />
</svg>
